[package]
name = "swig-interface"
version.workspace = true
edition = "2021"
license = "AGPL-3.0"
description = "Instruction builders for the Swig Solana protocol"
authors.workspace = true
documentation.workspace = true
repository = "https://github.com/anagrambuild/swig-wallet"

[dependencies]
pinocchio = "0.9"
bytemuck = { version = "1.19.0", features = ["derive"] }
solana-sdk = { version = "4.0.1" }
solana-system-interface = "3.1.0"
swig-compact-instructions = { path = "../instructions", version = "=4.0.0", default-features = false, features = [
    "client",
] }
swig-state = { path = "../state", version = "=4.0.0" }
anyhow = "1.0.75"
solana-secp256r1-program = "3.0.0"
thiserror = "2.0.20"

[dev-dependencies]
swig-program = { package = "swig", path = "../program", default-features = false, features = [
    "no-entrypoint",
] }
openssl = "0.10.76"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
