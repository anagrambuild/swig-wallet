[package]
name = "swig-interface"
version.workspace = true
edition = "2021"
license = "AGPL-3.0"
description = "Solana program for the Swig protocol"
publish = false
authors.workspace = true
documentation.workspace = true

[dependencies]
bytemuck = { version = "1.19.0", features = ["derive"] }
solana-sdk = { version = "4.0.1" }
solana-system-interface = "3.1.0"
swig = { path = "../program", default-features = false, features = [
    "no-entrypoint",
] }
swig-compact-instructions = { path = "../instructions", default-features = false, features = [
    "client",
] }
swig-state = { path = "../state" }
anyhow = "1.0.75"
solana-secp256r1-program = "3.0.0"
base64 = "0.22.1"
curve25519-dalek = "4.1.3"
openssl = "0.10.76"
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
