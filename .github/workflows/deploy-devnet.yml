name: Deploy Swig to Devnet

on:
  workflow_dispatch:

concurrency:
  group: swig-devnet-upgrade
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: 1.96.1
  SOLANA_VERSION: 4.2.2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      source_sha: ${{ steps.source.outputs.sha }}
      release_tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Resolve latest main and require successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::Reruns are disabled. Inspect the original deployment before starting another run."
            exit 1
          fi
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a valid main commit."
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=devnet-upgrade-${GITHUB_RUN_NUMBER}-${source_sha:0:12}" >> "$GITHUB_OUTPUT"
          for workflow in build-and-test.yml lint.yml; do
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" --commit "$source_sha" --branch main --event push \
              --limit 1 --json status,conclusion \
              --jq '.[0] | .status == "completed" and .conclusion == "success"')
            if [ "$passed" != true ]; then
              echo "::error::$workflow must pass on latest main ($source_sha) before deployment."
              exit 1
            fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install pinned SBF compiler
        run: cargo install cargo-build-sbf --version 4.0.0 --locked --force

      - name: Build production program
        run: |
          cargo build-sbf --arch v3 --tools-version v1.53 -- --locked
          mkdir release-inputs
          cp target/deploy/swig.so tools/release/deploy-devnet.sh release-inputs/
          cd release-inputs
          sha256sum swig.so deploy-devnet.sh > SHA256SUMS
          sha256sum swig.so > swig.so.sha256

      - name: Save immutable build inputs
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devnet-release-inputs-${{ steps.source.outputs.sha }}
          path: release-inputs/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Restrict this environment to main and configure its three secrets:
    # SOLANA_RPC_URL, PROGRAM_AUTHORITY_KEYPAIR (JSON array), SWIG_PROGRAM_ID.
    environment: swig-devnet
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: release-inputs

      - name: Verify build inputs
        working-directory: release-inputs
        run: sha256sum --check SHA256SUMS

      - name: Install pinned Solana CLI
        run: |
          sh -c "$(curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Validate, publish and deploy directly to devnet
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          PROGRAM_AUTHORITY_KEYPAIR: ${{ secrets.PROGRAM_AUTHORITY_KEYPAIR }}
          SWIG_PROGRAM_ID: ${{ secrets.SWIG_PROGRAM_ID }}
        run: bash release-inputs/deploy-devnet.sh

      - name: Preserve public deployment and recovery information
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devnet-upgrade-receipts-${{ github.run_id }}
          path: deployment/
          if-no-files-found: ignore
          retention-days: 90
