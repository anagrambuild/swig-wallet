name: Propose Swig Upgrade

on:
  workflow_dispatch:

# A run represents one immutable candidate. Never cancel a buffer upload or
# submission in favor of a later run.
concurrency:
  group: swig-upgrade
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: 1.96.1
  SOLANA_VERSION: 4.2.2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Require a fresh manual run from main
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::Reruns are disabled. Inspect the original tag, buffer and transaction before starting a new release run."
            exit 1
          fi

      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in build-and-test.yml lint.yml; do
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" --commit "$GITHUB_SHA" --branch main --event push \
              --limit 1 --json status,conclusion \
              --jq '.[0] | .status == "completed" and .conclusion == "success"')
            if [ "$passed" != true ]; then
              echo "::error::$workflow must pass on $GITHUB_SHA before proposing an upgrade."
              exit 1
            fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Validate and build release CLI
        run: |
          cargo fmt --manifest-path tools/release/Cargo.toml --all -- --check
          cargo clippy --manifest-path tools/release/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path tools/release/Cargo.toml --locked
          cargo build --manifest-path tools/release/Cargo.toml --locked --release

      - name: Install pinned SBF compiler
        run: cargo install cargo-build-sbf --version 4.0.0 --locked --force

      - name: Build production program
        run: |
          cargo build-sbf --arch v3 --tools-version v1.53 -- --locked
          mkdir release-inputs
          cp target/deploy/swig.so tools/release/target/release/swig-release release-inputs/
          cd release-inputs
          sha256sum swig.so swig-release > SHA256SUMS
          sha256sum swig.so > swig.so.sha256

      - name: Save immutable build inputs
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-inputs-${{ github.sha }}
          path: release-inputs/
          if-no-files-found: error
          retention-days: 30

  propose:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Configure this environment with a selected-branch rule for main before
    # adding the six required secrets. No repository/organization fallbacks.
    environment: swig-upgrade
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: release-inputs

      - name: Verify build inputs
        working-directory: release-inputs
        run: |
          sha256sum --check SHA256SUMS
          chmod 700 swig-release

      - name: Install pinned Solana CLI
        run: |
          sh -c "$(curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Validate deployment before tagging or uploading
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          PROPOSER_KEYPAIR: ${{ secrets.PROPOSER_KEYPAIR }}
          SQUADS_PROGRAM_ID: ${{ secrets.SQUADS_PROGRAM_ID }}
          SQUADS_MULTISIG_ADDRESS: ${{ secrets.SQUADS_MULTISIG_ADDRESS }}
          SQUADS_VAULT_INDEX: ${{ secrets.SQUADS_VAULT_INDEX }}
          SWIG_PROGRAM_ID: ${{ secrets.SWIG_PROGRAM_ID }}
        run: |
          ./release-inputs/swig-release check --binary release-inputs/swig.so > preflight.json
          echo "RELEASE_TAG=upgrade-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Tag the validated commit and publish upgrade candidate
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          cat > release-notes.txt <<EOF
          Swig upgrade candidate built from commit $GITHUB_SHA.

          Proposal creation is pending. This release does not indicate that an on-chain upgrade has been approved or executed.

          Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --title "$RELEASE_TAG" --notes-file release-notes.txt \
            release-inputs/swig.so release-inputs/swig.so.sha256 preflight.json

      - name: Upload buffer and create proposal
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          PROPOSER_KEYPAIR: ${{ secrets.PROPOSER_KEYPAIR }}
          SQUADS_PROGRAM_ID: ${{ secrets.SQUADS_PROGRAM_ID }}
          SQUADS_MULTISIG_ADDRESS: ${{ secrets.SQUADS_MULTISIG_ADDRESS }}
          SQUADS_VAULT_INDEX: ${{ secrets.SQUADS_VAULT_INDEX }}
          SWIG_PROGRAM_ID: ${{ secrets.SWIG_PROGRAM_ID }}
        run: |
          umask 077
          proposer_file="$RUNNER_TEMP/swig-proposer.json"
          buffer_file="$RUNNER_TEMP/swig-buffer.json"
          upload_log="$RUNNER_TEMP/swig-upload.log"
          trap 'rm -f "$proposer_file" "$buffer_file" "$upload_log"' EXIT
          printf '%s' "$PROPOSER_KEYPAIR" > "$proposer_file"
          solana-keygen new --no-bip39-passphrase --silent --outfile "$buffer_file" > /dev/null
          buffer=$(solana-keygen pubkey "$buffer_file")
          printf '%s\n' "$buffer" > buffer-address.txt
          echo "Buffer: $buffer" >> "$GITHUB_STEP_SUMMARY"
          binary_bytes=$(jq -er '.binary_bytes' preflight.json)
          transaction_index=$(jq -er '.transaction_index' preflight.json)
          if ! solana program write-buffer release-inputs/swig.so \
            --url "$SOLANA_RPC_URL" --keypair "$proposer_file" \
            --buffer "$buffer_file" --max-len "$binary_bytes" \
            --use-rpc --commitment confirmed --max-sign-attempts 3 \
            > "$upload_log" 2>&1; then
            echo "::error::Buffer upload failed. Inspect buffer $buffer; the proposer retains authority for recovery."
            exit 1
          fi
          ./release-inputs/swig-release propose --binary release-inputs/swig.so \
            --buffer "$buffer" --transaction-index "$transaction_index" \
            --source-commit "$GITHUB_SHA" --tag "$RELEASE_TAG" > proposal-receipt.json

      - name: Publish confirmed proposal receipt
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" proposal-receipt.json
          cat > release-notes.txt <<EOF
          Swig upgrade candidate built from commit $GITHUB_SHA.

          The active Squads proposal and verified buffer are recorded in proposal-receipt.json. Multisig members must approve and execute the upgrade.

          Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.txt
          cat proposal-receipt.json >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve public recovery information
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-receipts-${{ github.run_id }}
          path: |
            preflight.json
            buffer-address.txt
            proposal-receipt.json
          if-no-files-found: ignore
          retention-days: 90
