name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: 1.96.1
  SOLANA_VERSION: 4.2.2
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: true
  SCCACHE_CACHE_SIZE: 2G

jobs:
  build-and-test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy, rust-analyzer

      - name: Install libudev-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@65101d47ea8028ed0c98a1cdea8dd9182e9b5133 # v0.0.8

      - name: Cache Cargo dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: nextest

      - name: Install SBPF v3 compiler
        run: |
          cargo install cargo-build-sbf --version 4.0.0 --locked --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Solana Program
        run: cargo build-sbf --arch v3 --tools-version v1.53

      - name: Run Rust Tests with nextest
        run: |
          cargo nextest run --config-file nextest.toml --profile ci --all --workspace --no-fail-fast
          mkdir -p target/nextest/reports
          cp target/nextest/ci/output.xml target/nextest/reports/standard-tests.xml

      - name: Build Solana Program with program_scope_test feature
        run: cargo build-sbf --arch v3 --tools-version v1.53 --features=program_scope_test

      - name: Run Program Scope Tests with nextest
        run: |
          cargo nextest run --config-file nextest.toml --profile ci --all --workspace --no-fail-fast --exclude test-program-authority --features=program_scope_test
          mkdir -p target/nextest/reports
          cp target/nextest/ci/output.xml target/nextest/reports/program-scope-tests.xml
      
      - name: Run Rust SDK Tests with nextest
        run: |
          cargo nextest run --config-file nextest.toml --profile ci --all --workspace --no-fail-fast --exclude test-program-authority --features=rust_sdk_test,program_scope_test
          mkdir -p target/nextest/reports
          cp target/nextest/ci/output.xml target/nextest/reports/rust-sdk-tests.xml

      # Stake tests are gated behind the `stake_tests` feature and talk to a real
      # validator over RPC, so they need both the feature flag and a running
      # validator. Without this step they are silently compiled out.
      - name: Build Solana Program for stake tests
        run: cargo build-sbf --arch v3 --tools-version v1.53

      - name: Start test validator for stake tests
        run: |
          solana-test-validator \
            --limit-ledger-size 0 \
            --bind-address 127.0.0.1 \
            --bpf-program swigypWHEksbC64pWKwah1WTeh9JXwx8H1rJHLdbQMB target/deploy/swig.so \
            --reset \
            --ticks-per-slot 10 \
            --slots-per-epoch 64 \
            --ledger /tmp/stake-test-ledger \
            > /tmp/stake-validator.log 2>&1 &
          echo "waiting for validator RPC"
          for i in $(seq 1 60); do
            if curl -s -m 3 http://127.0.0.1:8899 -X POST \
                -H 'content-type: application/json' \
                -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -q ok; then
              echo "validator healthy"
              exit 0
            fi
            sleep 2
          done
          echo "validator failed to start" >&2
          tail -50 /tmp/stake-validator.log >&2
          exit 1

      # Run serially: the tests share one validator, and the delegation test
      # waits on epoch boundaries.
      - name: Run Stake Tests with nextest
        run: |
          cargo nextest run --config-file nextest.toml --profile ci --all --workspace --no-fail-fast --exclude test-program-authority --features=stake_tests --test-threads=1
          mkdir -p target/nextest/reports
          cp target/nextest/ci/output.xml target/nextest/reports/stake-tests.xml

      - name: Stop test validator
        if: always()
        run: pkill -f "[s]olana-test-validator" || true

      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: target/nextest/reports/*.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@150e2f992e4fad1379da2056d1d1c279f520e058 # v3
        if: always()
        with:
          report_paths: "target/nextest/reports/*.xml"
          check_name: "Test Results"
