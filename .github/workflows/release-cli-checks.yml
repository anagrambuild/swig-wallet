name: Release CLI Checks

on:
  pull_request:
    paths:
      - tools/release/**
      - .github/workflows/propose-upgrade.yml
      - .github/workflows/release-cli-checks.yml
  push:
    branches: [main]
    paths:
      - tools/release/**
      - .github/workflows/propose-upgrade.yml
      - .github/workflows/release-cli-checks.yml

permissions:
  contents: read

jobs:
  release-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/release/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path tools/release/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path tools/release/Cargo.toml --locked
