[package]
name = "swig-release"
version = "0.1.0"
edition = "2021"
publish = false

# Keep the Squads client toolchain separate from the on-chain workspace.
[workspace]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
solana-sdk = "=2.2.2"
solana-sdk-ids = "=2.2.1"
# Squads still uses SDK 2.x. These crates own the v1 outer transaction wire format.
solana-instruction-v1 = { package = "solana-instruction", version = "=3.4.0" }
solana-message-v1 = { package = "solana-message", version = "=4.4.1", features = ["wincode"] }
solana-transaction-v1 = { package = "solana-transaction", version = "=4.1.6", features = ["wincode", "verify"] }
wincode = "0.5"
solana-system-interface = "=1.0.0"
solana-loader-v3-interface = { version = "=3.0.0", features = ["bincode"] }
squads-multisig = { git = "https://github.com/Squads-Protocol/v4", rev = "af94153ff77a28b6effe46b9c94baaa93742b48c" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
zeroize = "1"
tempfile = "3"

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
