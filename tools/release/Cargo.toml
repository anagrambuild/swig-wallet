[package]
name = "swig-release"
version = "0.1.0"
edition = "2021"
publish = false

# Keep the Squads client toolchain separate from the on-chain workspace.
[workspace]

[dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-sdk = "=2.2.2"
solana-sdk-ids = "=2.2.1"
solana-loader-v3-interface = { version = "=3.0.0", features = ["bincode"] }
squads-multisig = { git = "https://github.com/Squads-Protocol/v4", rev = "af94153ff77a28b6effe46b9c94baaa93742b48c" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
zeroize = "1"

[profile.release]
strip = true
