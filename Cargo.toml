[workspace]
resolver = "2"
default-members = ["program", "test-program-authority"]
members = [
  "program",
  "interface",
  "instructions",
  "state",
  "assertions",
  "no-padding",
  "rust-sdk",
  "cli",
  "test-program-authority",
]

[workspace.package]
version = "3.0.0"
authors = ["SWIG Team"]
documentation = "https://build.onswig.com"

[workspace.dependencies]
litesvm = { version = "=0.11.0", features = ["precompiles"] }
litesvm-token = "=0.11.0"

[workspace.lints.rust]
unused_imports = "allow"
unused_mut = "allow"
dead_code = "allow"
unused_macros = "allow"
unused_variables = "allow"


[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
